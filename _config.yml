title: Null Dragon
tagline: Cybersecurity Research
description: >-
  I'm Null Dragon. I research vulnerabilities, reverse engineer systems,
  investigate threat actors, and document what I learn.
author: Null Dragon

baseurl: ""
url: "https://thenulldragon.github.io"

github_username: TheNullDragon

markdown: kramdown
permalink: /writeups/:year/:month/:day/:title/

collections:
  research:
    output: true
    permalink: /research/:path/
  threat_intel:
    output: true
    permalink: /threat-intel/:path/
  projects:
    output: true
    permalink: /projects/:path/

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
