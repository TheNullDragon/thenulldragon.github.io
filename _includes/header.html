<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Null Dragon home">
      <img class="logo" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="">
      <span>
        <span class="brand-name">NULL DRAGON</span>
        <span class="brand-tag">CYBERSECURITY RESEARCH</span>
      </span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>HOME</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' or page.url contains '/writeups' %}class="active"{% endif %}>RESEARCH</a>
      <a href="{{ '/threat-intel/' | relative_url }}" {% if page.url contains '/threat-intel' %}class="active"{% endif %}>THREAT INTEL</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>PROJECTS</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>ABOUT</a>
    </nav>

    <div class="header-actions">
      <a class="github-link" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="Null Dragon on GitHub">
        {% include icon.html name="github" %}<span>GITHUB</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
    </div>
  </div>
</header>
