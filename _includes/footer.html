<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="">
      <span>
        <span class="name">NULL DRAGON</span><br>
        <span class="sub">Cybersecurity Research</span>
      </span>
    </div>

    <div class="footer-meta">
      &copy; {{ 'now' | date: "%Y" }} Null Dragon. All rights reserved.<br>
      Built with 💜 and secured with paranoia.
      <div class="footer-links">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span aria-hidden="true">/</span>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <span aria-hidden="true">/</span>
        <a href="{{ '/disclaimer/' | relative_url }}">Disclaimer</a>
      </div>
    </div>

    <a class="back-to-top" href="#top" aria-label="Back to top">{% include icon.html name="chevron" %}</a>
  </div>
</footer>
